name: PHP compatibility

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint legacy PHP files
        run: find files/legacy -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint Plugin Manager PHP files
        if: matrix.php != '7.3'
        run: find files/zc_plugins -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check required Offer properties
        run: bash tests/check-offer-fields.sh
